---
layout: default
---
<article class="max-w-4xl mx-auto">
    <header class="mb-10">
        <h1 class="text-4xl md:text-5xl font-bold mb-4 text-gray-900">{{ page.title }}</h1>
        <div class="flex flex-wrap items-center gap-4 text-gray-600">
            <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-semibold tracking-wide">{{ page.category }}</span>
            <span class="font-medium"><i class="far fa-calendar-alt mr-1"></i> {{ page.date | date: "%B %Y" }}</span>
        </div>
    </header>

    {% if page.image %}
    <div class="mb-12 rounded-xl overflow-hidden shadow-lg border border-gray-100">
        <img src="{{ page.image }}" alt="{{ page.title }}" class="w-full object-cover max-h-[500px]">
    </div>
    {% endif %}

    <div class="prose prose-lg max-w-none prose-blue prose-img:rounded-xl">
        {{ content }}
    </div>

    <div class="mt-16 pt-8 border-t border-gray-200 flex justify-between items-center">
        <a href="{{ site.baseurl }}/portfolio" class="text-blue-600 hover:text-blue-800 font-semibold inline-flex items-center transition"><i class="fas fa-arrow-left mr-2"></i> Back to Portfolio</a>
    </div>
</article>
