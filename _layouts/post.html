---
layout: default
---
<article class="max-w-3xl mx-auto">
    <header class="mb-10 text-center">
        <h1 class="text-4xl md:text-5xl font-bold mb-4 text-gray-900">{{ page.title }}</h1>
        <p class="text-gray-500 font-medium">
            <i class="far fa-calendar-alt mr-2"></i>{{ page.date | date: "%B %d, %Y" }}
            {% if page.author %} <span class="mx-2">•</span> <i class="far fa-user mr-2"></i>{{ page.author }}{% endif %}
        </p>
    </header>

    {% if page.image %}
    <div class="mb-10 rounded-xl overflow-hidden shadow-md">
        <img src="{{ page.image }}" alt="{{ page.title }}" class="w-full h-auto">
    </div>
    {% endif %}

    <div class="prose prose-lg max-w-none prose-blue prose-img:rounded-xl">
        {{ content }}
    </div>

    <div class="mt-16 pt-8 border-t border-gray-200">
        <a href="{{ site.baseurl }}/blog" class="text-blue-600 hover:text-blue-800 font-semibold inline-flex items-center transition"><i class="fas fa-arrow-left mr-2"></i> Back to Blog</a>
    </div>
</article>
