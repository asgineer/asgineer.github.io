<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>asgineer | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-wrap {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .auth-card {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }
    .auth-logo { text-align: center; font-size: 1.8rem; font-weight: 800; margin-bottom: 0.3rem; }
    .auth-logo span { color: var(--color-accent); }
    .auth-subtitle { text-align: center; color: var(--color-text-muted); margin-bottom: 2rem; font-size: .93rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: .4rem; font-weight: 600; font-size: .9rem; }
    .form-group input {
      width: 100%; padding: .7rem 1rem;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius);
      font-size: .95rem; font-family: var(--font-main);
      transition: border-color var(--transition);
      background: var(--color-bg);
    }
    .form-group input:focus { outline: none; border-color: var(--color-accent); }
    .form-error { color: #e74c3c; font-size: .85rem; margin-top: .3rem; display: none; }
    .form-error.show { display: block; }
    .btn-block { width: 100%; padding: .75rem; font-size: 1rem; margin-top: .5rem; }
    .auth-switch { text-align: center; margin-top: 1.5rem; font-size: .9rem; color: var(--color-text-muted); }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 2.8rem; }
    .toggle-pw {
      position: absolute; right: .8rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--color-text-muted);
      font-size: .85rem; padding: .2rem;
    }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="page-wrapper">
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo">as<span>gineer</span></div>
        <p class="auth-subtitle">Sign in to your account</p>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login">Email or Username</label>
            <input type="text" id="login" name="login" placeholder="you@example.com" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
              <button type="button" class="toggle-pw" id="toggle-pw">Show</button>
            </div>
          </div>

          <div class="form-error" id="login-error"></div>

          <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign In</button>
        </form>

        <p class="auth-switch">
          Don't have an account? <a href="signup.html">Sign Up</a>
        </p>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="js/nav.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Redirect if already logged in
    if (api.isLoggedIn()) {
      window.location.href = 'index.html';
    }

    const form      = document.getElementById('login-form');
    const errEl     = document.getElementById('login-error');
    const submitBtn = document.getElementById('submit-btn');
    const pwInput   = document.getElementById('password');
    const togglePw  = document.getElementById('toggle-pw');

    togglePw.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type    = show ? 'text' : 'password';
      togglePw.textContent = show ? 'Hide' : 'Show';
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      errEl.classList.remove('show');
      submitBtn.disabled    = true;
      submitBtn.textContent = 'Signing in…';

      const login    = document.getElementById('login').value.trim();
      const password = pwInput.value;

      if (!login || !password) {
        showError('Please fill in all fields.');
        return;
      }

      try {
        await api.login(login, password);
        // Redirect based on role
        const user = api.getUser();
        if (user.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          const next = new URLSearchParams(window.location.search).get('next') || 'index.html';
          window.location.href = next;
        }
      } catch (err) {
        showError(err.message || 'Login failed. Please try again.');
      }
    });

    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.add('show');
      submitBtn.disabled    = false;
      submitBtn.textContent = 'Sign In';
    }
  </script>
</body>
</html>
