<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>asgineer | Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Like button */
    .like-btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .55rem 1.3rem; border: 2px solid var(--color-border);
      border-radius: 30px; background: var(--color-bg-card);
      font-size: .92rem; font-weight: 600; cursor: pointer;
      transition: all var(--transition);
    }
    .like-btn:hover      { border-color: #e74c3c; color: #e74c3c; }
    .like-btn.liked      { border-color: #e74c3c; background: #e74c3c; color: #fff; }
    .like-btn .heart     { font-size: 1.1rem; }

    /* Comments */
    .comments-section { margin-top: 3rem; padding-top: 2rem; border-top: 2px solid var(--color-border); }
    .comments-section h3 { font-size: 1.3rem; margin-bottom: 1.5rem; }

    .comment-card {
      display: flex; gap: 1rem; margin-bottom: 1.5rem;
    }
    .comment-avatar {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--color-primary), #2e86de);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 700; color: #fff;
    }
    .comment-body-wrap { flex: 1; }
    .comment-meta { display: flex; align-items: center; gap: .7rem; margin-bottom: .3rem; }
    .comment-author { font-weight: 700; font-size: .88rem; }
    .comment-date   { color: var(--color-text-muted); font-size: .78rem; }
    .comment-role   { font-size: .7rem; }
    .comment-body p { font-size: .92rem; line-height: 1.65; }
    .comment-delete {
      background: none; border: none; cursor: pointer;
      color: var(--color-text-muted); font-size: .78rem; padding: 0;
      transition: color var(--transition);
    }
    .comment-delete:hover { color: #e74c3c; }

    /* Comment form */
    .comment-form-wrap {
      background: var(--color-bg-card); border: 1px solid var(--color-border);
      border-radius: var(--radius); padding: 1.5rem; margin-top: 2rem;
    }
    .comment-form-wrap h4 { margin-bottom: 1rem; font-size: 1rem; }
    .comment-form-wrap textarea {
      width: 100%; padding: .7rem 1rem; border: 1.5px solid var(--color-border);
      border-radius: var(--radius); font-family: var(--font-main); font-size: .93rem;
      resize: vertical; min-height: 90px; background: var(--color-bg);
      transition: border-color var(--transition);
    }
    .comment-form-wrap textarea:focus { outline: none; border-color: var(--color-accent); }
    .comment-actions { display: flex; align-items: center; gap: 1rem; margin-top: .7rem; }
    .login-to-comment {
      background: rgba(46,134,222,.07); border: 1px solid rgba(46,134,222,.2);
      border-radius: var(--radius); padding: 1rem 1.2rem; font-size: .88rem;
      color: var(--color-text-muted); margin-top: 1.5rem;
    }

    /* Post meta bar at top */
    .post-meta-full { display: flex; gap: 1.5rem; flex-wrap: wrap;
      align-items: center; margin-bottom: .5rem; font-size: .88rem; color: rgba(255,255,255,.75); }
    .author-chip {
      display: inline-flex; align-items: center; gap: .4rem;
      background: rgba(255,255,255,.12); padding: .25rem .8rem;
      border-radius: 30px; font-size: .82rem; color: rgba(255,255,255,.9);
    }

    /* Math rendering placeholder */
    .math-inline, .math-block { background: rgba(46,134,222,.07); border-radius: 4px; padding: .1rem .3rem; }
    .math-block { display: block; padding: .8rem; text-align: center; margin: 1rem 0; overflow-x: auto; }

    /* Loading skeleton */
    .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite;
      border-radius: 4px; display: block; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="page-wrapper">

    <!-- Post hero (populated by JS) -->
    <div class="post-hero" id="post-hero">
      <div class="container">
        <div class="breadcrumb" style="margin-bottom:1rem">
          <a href="index.html" style="color:rgba(255,255,255,.6)">Home</a>
          <span class="sep">›</span>
          <a href="blog.html" style="color:rgba(255,255,255,.6)">Blog</a>
          <span class="sep">›</span>
          <span id="breadcrumb-cat">Post</span>
        </div>
        <div id="post-category-badge"></div>
        <h1 id="post-title">Loading…</h1>
        <div class="post-meta-full">
          <span id="post-author-chip"></span>
          <span id="post-date"></span>
          <span id="post-stats"></span>
        </div>
      </div>
    </div>

    <!-- Article body -->
    <article class="post-content" id="post-body">
      <div class="skeleton" style="height:1rem;width:80%;margin-bottom:.8rem"></div>
      <div class="skeleton" style="height:1rem;width:95%;margin-bottom:.8rem"></div>
      <div class="skeleton" style="height:1rem;width:70%;margin-bottom:.8rem"></div>
    </article>

    <!-- Reactions & comments -->
    <div class="post-content" id="post-reactions" style="border-top:2px solid var(--color-border);padding-top:2rem">

      <!-- Like -->
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:2rem">
        <button class="like-btn" id="like-btn" onclick="toggleLike()">
          <span class="heart">🤍</span>
          <span id="like-count">0</span> Likes
        </button>
        <a href="#comments" class="btn btn-outline" style="padding:.5rem 1.2rem;font-size:.9rem">
          💬 <span id="comment-count-btn">0</span> Comments
        </a>
        <div id="author-edit-btns" style="display:none">
          <a id="edit-post-btn" href="#" class="btn btn-outline" style="padding:.5rem 1rem;font-size:.85rem">✏️ Edit</a>
        </div>
      </div>

      <!-- Comments section -->
      <div class="comments-section" id="comments">
        <h3>Comments (<span id="comment-count">0</span>)</h3>
        <div id="comments-list">
          <p style="color:var(--color-text-muted);font-size:.9rem">Loading comments…</p>
        </div>

        <!-- Add comment form -->
        <div id="comment-form-area"></div>
      </div>

    </div>

  </main>

  <div id="footer-placeholder"></div>

  <!-- KaTeX auto-render -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <script src="js/nav.js"></script>
  <script src="js/api.js"></script>
  <script>
    const slug = new URLSearchParams(window.location.search).get('slug');
    if (!slug) { window.location.href = 'blog.html'; }

    let currentPostId = null;

    /* ── Load post ── */
    async function loadPost() {
      try {
        const post = await api.get('/posts/' + slug);
        currentPostId = post.id;

        // Update page title
        document.title = `asgineer | ${post.title}`;

        // Hero
        document.getElementById('breadcrumb-cat').textContent = post.category.charAt(0).toUpperCase() + post.category.slice(1);
        document.getElementById('post-category-badge').innerHTML =
          `<span class="filter-tag tag-${post.category}" style="margin-bottom:.8rem;display:inline-block">${post.category}</span>`;
        document.getElementById('post-title').textContent = post.title;
        document.getElementById('post-author-chip').innerHTML =
          `<span class="author-chip">✍️ ${esc(post.author)}</span>`;
        document.getElementById('post-date').textContent = '📅 ' + fmtDate(post.created_at);
        document.getElementById('post-stats').textContent =
          `❤️ ${post.likes}  •  💬 ${post.comment_count}`;

        // Body
        const bodyEl = document.getElementById('post-body');
        bodyEl.innerHTML = post.body;

        // Render LaTeX ($...$ and $$...$$)
        renderMathInElement(bodyEl, {
          delimiters: [
            { left: '$$', right: '$$', display: true  },
            { left: '$',  right: '$',  display: false }
          ],
          throwOnError: false
        });

        // Like state
        document.getElementById('like-count').textContent = post.likes;
        if (api.isLoggedIn()) {
          const { liked, count } = await api.get(`/posts/${post.id}/like`);
          setLikeState(liked, count);
        }

        // Show edit button for post author or admin
        const me = api.getUser();
        if (me && (me.id === post.author_id || me.role === 'admin')) {
          const editEl = document.getElementById('author-edit-btns');
          document.getElementById('edit-post-btn').href = `new-post.html?edit=${post.id}`;
          editEl.style.display = 'block';
        }

        // Load comments
        await loadComments(post.id);

      } catch (err) {
        document.getElementById('post-title').textContent = '404 – Post Not Found';
        document.getElementById('post-body').innerHTML =
          `<p style="color:var(--color-text-muted)">This post could not be loaded. <a href="blog.html">← Back to Blog</a></p>`;
      }
    }

    /* ── Like toggle ── */
    async function toggleLike() {
      if (!api.isLoggedIn()) {
        window.location.href = `login.html?next=${encodeURIComponent(window.location.href)}`;
        return;
      }
      try {
        const { liked, count } = await api.post(`/posts/${currentPostId}/like`);
        setLikeState(liked, count);
      } catch {}
    }
    function setLikeState(liked, count) {
      const btn = document.getElementById('like-btn');
      btn.querySelector('.heart').textContent = liked ? '❤️' : '🤍';
      btn.querySelector('#like-count').textContent = count;
      btn.classList.toggle('liked', liked);
    }

    /* ── Comments ── */
    async function loadComments(postId) {
      const list      = document.getElementById('comments-list');
      const countEl   = document.getElementById('comment-count');
      const countBtn  = document.getElementById('comment-count-btn');
      const formArea  = document.getElementById('comment-form-area');
      const me        = api.getUser();

      try {
        const comments = await api.get(`/posts/${postId}/comments`);
        countEl.textContent  = comments.length;
        countBtn.textContent = comments.length;

        if (!comments.length) {
          list.innerHTML = '<p style="color:var(--color-text-muted);font-size:.9rem">No comments yet. Be the first!</p>';
        } else {
          list.innerHTML = comments.map(c => `
            <div class="comment-card" id="comment-${c.id}">
              <div class="comment-avatar">${c.username.charAt(0).toUpperCase()}</div>
              <div class="comment-body-wrap">
                <div class="comment-meta">
                  <span class="comment-author">${esc(c.username)}</span>
                  <span class="role-badge role-${c.user_role}">${c.user_role}</span>
                  <span class="comment-date">${fmtDate(c.created_at)}</span>
                  ${(me && (me.id === c.user_id || me.role === 'admin'))
                    ? `<button class="comment-delete" onclick="deleteComment(${c.id}, ${postId})">🗑 Delete</button>`
                    : ''}
                </div>
                <div class="comment-body"><p>${esc(c.body)}</p></div>
              </div>
            </div>
          `).join('');
        }

        // Comment form
        if (me) {
          formArea.innerHTML = `
            <div class="comment-form-wrap">
              <h4>Leave a comment</h4>
              <textarea id="new-comment" placeholder="Share your thoughts…"></textarea>
              <div class="comment-actions">
                <button class="btn btn-primary" onclick="submitComment(${postId})">Post Comment</button>
                <span id="comment-err" style="color:#e74c3c;font-size:.85rem"></span>
              </div>
            </div>`;
        } else {
          formArea.innerHTML = `
            <div class="login-to-comment">
              🔒 <a href="login.html?next=${encodeURIComponent(window.location.href)}">Sign in</a>
              or <a href="signup.html">create an account</a> to leave a comment.
            </div>`;
        }
      } catch { }
    }

    async function submitComment(postId) {
      const textarea = document.getElementById('new-comment');
      const errEl    = document.getElementById('comment-err');
      const body     = textarea.value.trim();

      if (!body) { errEl.textContent = 'Comment cannot be empty.'; return; }
      errEl.textContent = '';
      textarea.disabled = true;

      try {
        await api.post(`/posts/${postId}/comments`, { body });
        textarea.value = '';
        await loadComments(postId);
      } catch (err) {
        errEl.textContent = err.message;
      } finally {
        textarea.disabled = false;
      }
    }

    async function deleteComment(commentId, postId) {
      if (!confirm('Delete this comment?')) return;
      try {
        await api.del(`/posts/${postId}/comments/${commentId}`);
        document.getElementById('comment-' + commentId)?.remove();
        const countEl  = document.getElementById('comment-count');
        const countBtn = document.getElementById('comment-count-btn');
        const n = parseInt(countEl.textContent) - 1;
        countEl.textContent = n;
        countBtn.textContent = n;
      } catch (err) {
        alert(err.message);
      }
    }

    /* ── Helpers ── */
    function esc(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function fmtDate(s) {
      return new Date(s).toLocaleDateString('en-GB', { year:'numeric', month:'long', day:'numeric' });
    }

    /* ── Init ── */
    loadPost();
  </script>
</body>
</html>
